<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>Almost done</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f7cf6">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=202610271236">
</head>
<body>
<header class="top">
  <nav class="seg" id="seg">
    <button data-tab="day" class="on">День</button>
    <button data-tab="week">Неделя</button>
    <button data-tab="projects">Проекты</button>
    <button data-tab="backlog">Запас</button>
    <button data-tab="memory">Память</button>
    <button data-tab="stats" class="webonly">Обзор</button>
    <button data-tab="line" class="webonly">Шкала</button>
  </nav>
</header>
<main id="view"><p class="hint">Загружаю…</p></main>
<div class="toast" id="toast" hidden></div>
<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<section class="chat" id="chat" aria-label="Чат с планером" hidden>
  <header class="chat-head"><button id="chatClose" type="button" aria-label="Закрыть чат">‹</button><div><strong id="chatTitle">Планер</strong><small id="chatSubtitle">Общий диалог</small></div></header>
  <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>
  <p class="chat-status" id="chatStatus" role="status" hidden></p>
  <form class="chat-compose" id="chatCompose" autocomplete="off">
    <button class="chat-mic" id="chatMic" type="button" aria-label="Начать запись" title="Голосом">🎙</button>
    <textarea id="chatText" rows="1" maxlength="2000" placeholder="Написать планеру…" aria-label="Сообщение планеру"></textarea>
    <button class="chat-send" id="chatSend" type="submit" aria-label="Отправить" disabled>↑</button>
  </form>
</section>
<form class="say" id="say" autocomplete="off">
  <button id="sayOpen" type="button" aria-label="Открыть чат с планером">Чат с планером <span>›</span></button>
  <button id="sayMic" type="button" aria-label="Начать голосовое сообщение" title="Голосом">🎙</button>
</form>
<script src="app.js?v=202610271236"></script>
</body>
</html>
